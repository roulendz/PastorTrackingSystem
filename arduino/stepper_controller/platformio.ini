; PlatformIO project configuration for Pastor Tracking stepper firmware.
; Target: Arduino Uno R3 (ATmega328P @ 16 MHz).
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 115200
; Test:    pio test -e native      (host-side unit tests)

[platformio]
default_envs = uno

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
build_src_flags =
    -Wall
    -Wextra
    -Werror

[env:uno]
platform = atmelavr
board = uno
upload_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter, default
lib_deps =
    waspinator/AccelStepper @ ^1.64

; Host-side unit tests (run on dev machine, not Uno)
[env:native]
platform = native
build_flags =
    -std=gnu++17
build_src_flags =
    -Wall
    -Wextra
    -Werror
test_framework = unity
